; ================================================================
;  8. MONDE RECOPIE DANS RoR2
; ================================================================

[Decor]
; 1 : le decor de Skyrim est recopie dans RoR2 avec ses VRAIES formes de collision (sol, maisons, arches,
;     rochers, barrieres, arbres...) : on peut passer sous une arche et y accrocher le grappin.
; 0 : ancien relief en grille (section [Relief]).
Activer = 1

; Distance (m) autour de toi ou le decor est recopie.
Rayon = 120

; Triangles lus au plus a chaque passage (2 par seconde). Plus = decor complet plus vite, mais petits a-coups.
TrianglesParPassage = 60000

[Sol]
; Les tout petits objets (cailloux, debris...) ne sont pas recopies dans RoR2 : le survivant butait dessus
; et decollait. Hauteur maximale (cm) et largeur maximale (cm) d'un objet ignore. 0 = tout recopier.
PetitsDetails = 10
PetitsDetailsLargeur = 100

; 1 : filet de securite pour les ennemis. Un ennemi deplace par RoR2 n'est jamais pose sous le sol de Skyrim,
;     et un ennemi qui tombe dans le vide (plus aucun sol sous lui) est ramene la ou il etait pose.
FiletEnnemis = 1

; (Le recollage du survivant au sol se regle dans r2modman, section "2 - Jeu", reglages "ColleAuSol".)

[Relief]
; Ancien systeme, utilise seulement si [Decor] Activer = 0 : le relief de Skyrim autour de toi est recopie
; dans RoR2 sous forme de grille (une surface invisible sous le survivant).
; 0 : desactive (le survivant marche sur un petit plateau plat).
Activer = 1

; Cote du carre mesure autour de toi (m) et distance entre deux mesures (m).
; Plus fin = plus precis, mais plus long a mettre a jour. 200 m au pas de 2 m : 129 x 129 points (le maximum).
Taille = 200
Pas = 2

; Points mesures par image (2 rayons chacun). Plus = relief mis a jour plus vite, mais plus de calcul.
PointsParImage = 400

; ---------------------------------------------------------------------------
; Coop (0.70) : rien a regler ici.
; La coop se regle dans r2modman, config de SkyrimRoR2, section "8 - Coop" :
;   Mode = Solo / Hote / Invite
;   IdentifiantHote = l'identifiant Steam (17 chiffres) de l'hote (pour les invites)
;   JoueursAttendus, AttenteMax, DistanceReleve, DureeReleve, DistanceAide, AttenteSeul
; L'hote trouve son identifiant dans le journal de BepInEx (ligne "Coop : ton identifiant Steam"),
; ou sur Steam : Parametres du compte > "Identifiant Steam" (17 chiffres).
