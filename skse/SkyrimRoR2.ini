; ================================================================
;  8. WORLD COPIED INTO RoR2
; ================================================================

[Decor]
; 1: Skyrim's scenery is copied into RoR2 with its REAL collision shapes (ground, houses, arches,
;    rocks, fences, trees...): you can walk under an arch and hook it with a grapple.
; 0: old grid terrain ([Relief] section).
Activer = 1

; Distance (m) around you where the scenery is copied.
Rayon = 120

; Triangles read at most per pass (2 per second). More = full scenery faster, but small hitches.
TrianglesParPassage = 60000

[Sol]
; Very small objects (pebbles, debris...) are not copied into RoR2: the survivor bumped into them
; and took off. Max height (cm) and max width (cm) of an ignored object. 0 = copy everything.
PetitsDetails = 10
PetitsDetailsLargeur = 100

; 1: safety net for enemies. An enemy moved by RoR2 is never put under Skyrim's ground,
;    and an enemy falling into the void (no ground under it anymore) is brought back where it was placed.
FiletEnnemis = 1

; (Keeping the survivor on the ground is set in r2modman, section "2 - Jeu", "ColleAuSol" settings.)

[Relief]
; Old system, only used if [Decor] Activer = 0: Skyrim's terrain around you is copied
; into RoR2 as a grid (an invisible surface under the survivor).
; 0: off (the survivor walks on a small flat platform).
Activer = 1

; Side of the measured square around you (m) and distance between two measures (m).
; Finer = more precise, but slower to update. 200 m with a 2 m step: 129 x 129 points (the maximum).
Taille = 200
Pas = 2

; Points measured per frame (2 rays each). More = terrain updated faster, but more work.
PointsParImage = 400

; ---------------------------------------------------------------------------
; Co-op: nothing to set here.
; Co-op is set in r2modman, SkyrimRoR2 config, section "8 - Coop":
;   Mode = Solo / Hote (host) / Invite (guest)
;   IdentifiantHote = the host's Steam ID (17 digits) (for guests)
;   JoueursAttendus, AttenteMax, DistanceReleve, DureeReleve, DistanceAide, AttenteSeul
; The host finds their ID in the BepInEx log (line "Coop : ton identifiant Steam"),
; or on Steam: Account details > "Steam ID" (17 digits).
; ---------------------------------------------------------------------------
