DA07 = FalseSon     ; Mehrunes Dagon : Les fragments du passe
DA10 = Acolyte      ; Molag Bal : La Maison des horreurs
DA11 = Croco        ; Namira : Le gout de la mort
DA14 = Chef         ; Sanguine : Une nuit inoubliable
TG08B = Bandit2     ; Nocturnal : Le retour des tenebres (Guilde des voleurs)


; ================================================================
;  7. VARIANTES DE COMPETENCES ET SKINS
; ================================================================

[Variantes]
; Variantes de competences (menu Magie > Pouvoirs, pouvoirs "RoR2 ...").
; 1 : toutes les variantes et skins sont libres (pour tester). 0 : il faut remplir les defis ci-dessous.
ToutDebloque = 0

[DefisVariantes]
; Le defi Skyrim qui debloque chaque variante. A gauche : survivant . competence (1 = M1, 2 = M2,
; 3 = Maj, 4 = R, 6 et 7 = cases en plus comme le passif et la Litanie de l'Acolyte) . numero de variante (0 = la variante de base, toujours libre ; les numeros sont dans
; %LOCALAPPDATA%\SkyrimRoR2\variantes.txt). A droite : une competence Skyrim et le niveau a atteindre
; (niveau de base, sans les bonus d'objets ou de potions).
; Competences : Archerie, Une main, Deux mains, Parade, Forge, Armure lourde, Armure legere, Vol a la tire,
; Crochetage, Discretion, Alchimie, Eloquence, Alteration, Conjuration (ou Invocation), Destruction, Illusion,
; Guerison, Enchantement. Ou "Niveau 20" pour le niveau du personnage, ou "Dragons 5" pour les dragons tues
; (comptes par le mod : chaque dragon qui meurt a moins de 100 m de toi). Une variante sans ligne est libre.

; --- Skins (menu des pouvoirs, "RoR2 Skin - ...") ---
; *.skin.1 vaut pour tous les survivants, Huntress.skin.1 pour un seul (il passe avant).
; Skin 0 = celui de base, toujours libre.
