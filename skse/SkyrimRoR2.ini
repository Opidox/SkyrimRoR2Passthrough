; ================================================================
;  SkyrimRoR2 - reglages
; ================================================================
;  Change la valeur apres le signe =, puis enregistre.
;  Pas besoin de recompiler : recharge simplement ta sauvegarde
;  dans Skyrim (le fichier est relu a chaque chargement).
;
;  Sommaire :
;    1. Commandes ........ [Touches]
;    2. Lancement ........ [Lancement]
;    3. Affichage ........ [HUD] [Mains] [TroisiemePersonne]
;    4. Jeu .............. [Mouvement] [Combat] [PV] [Objets] [Elites] [ObjetsSkyrim] [Difficulte] [AutelsRoR2]
;    5. Experience ....... [Experience] [ExperienceSurvivants] [ElementsDestruction] [EffetsDestruction]
;    6. Survivants ....... [Autels] [AutelsSurvivants] [QuetesSurvivants]
;    7. Variantes ........ [Variantes] [DefisVariantes]
;    8. Monde recopie .... [Decor] [Sol] [Relief]
;
;  Noms internes des survivants (utilises partout dans ce fichier) :
;    Commando, Huntress (Chasseresse), Bandit2 (Bandit), Toolbot (MUL-T), Engi (Ingenieur),
;    Mage (Artificiere), Merc (Mercenaire), Treebot (REX), Loader (Chargeuse), Croco (Acrid),
;    Captain (Capitaine), Railgunner, VoidSurvivor (Demon du vide), Seeker (Chercheuse),
;    FalseSon (Fils illegitime), Chef, DroneTech (Operateur), Drifter (Vagabonde),
;    Enforcer2 (Executeur), Acolyte.
; ================================================================

[Test]
; 1 : MODE TEST, tout est libre d'un coup, sans toucher a ta sauvegarde :
;     - F8 / F7 passent par TOUS les survivants (meme avec "changer en dormant") ;
;     - toutes les variantes de competences et tous les skins sont libres (menu Magie > Pouvoirs).
;     Remets 0 et recharge ta sauvegarde : tu retrouves tes vrais deblocages.
; 0 : jeu normal (autels, quetes et defis).
ModeTest = 0


; ================================================================
;  1. COMMANDES
; ================================================================

[Touches]
; Lettres et chiffres : ecris-les tels qu'ils sont sur TON clavier
; (Avancer = Z en AZERTY, Avancer = W en QWERTY).
; Noms speciaux possibles (sans accents) :
;   Espace  Tab  Entree  Retour
;   CtrlGauche  CtrlDroit  MajGauche  MajDroit  AltGauche  AltDroit
;   ClicGauche  ClicDroit  ClicMilieu  Souris4  Souris5
;   F1 a F12
;   Aucune   (pour ne rien associer a une action)
Avancer = Z
Reculer = S
Gauche = Q
Droite = D

Saut = Espace
Sprint = AltGauche

; Competences du survivant RoR2
Competence1 = ClicGauche
Competence2 = ClicDroit
Competence3 = MajGauche
Competence4 = R

; Changer de survivant en pleine partie (seulement si ChangerEnDormant = 0, ou avec ToucheTousLesSurvivants)
SurvivantSuivant = F8
SurvivantPrecedent = F7

; Activer l'equipement RoR2 (objet orange : la Preservatrice...)
Equipement = G
; Utiliser un autel RoR2 dans un donjon (en etant a cote)
Utiliser = E
; Afficher / cacher la liste des objets RoR2 (nom, nombre, description)
ListeObjets = O
; 0.72 : ouvrir le journal des objets RoR2 deja trouves (hors menus)
JournalRoR2 = K


; ================================================================
;  2. LANCEMENT
; ================================================================

[Lancement]
; Apres un chargement, le monde de Skyrim reste fige tant que RoR2 n'a pas lance sa partie
; (secondes au plus ; 0 = ne pas attendre)
AttendreRoR2 = 90
; 1 : Skyrim demarre RoR2 tout seul (avec ton profil r2modman), en petite fenetre.
LancerRoR2 = 1

; 1 : RoR2 passe les menus et lance une partie tout seul.
;     Si ton survivant meurt, il relance une partie quand tu recharges ta sauvegarde Skyrim.
PartieAuto = 1

; Le survivant de la partie automatique (nom interne, voir le sommaire, ou nom francais).
Survivant = Commando

; Dossier de ton profil r2modman. Vide = le profil "Passthrough" habituel.
ProfilR2modman =

; Taille de la fenetre RoR2 au lancement (0 = ne pas changer).
FenetreLargeur = 960
FenetreHauteur = 540

; 1 : la fenetre RoR2 est cachee (tout se voit dans Skyrim grace au HUD).
; 0 : elle reste visible (pratique pour comparer).
CacherFenetreRoR2 = 1


; ================================================================
;  3. AFFICHAGE
; ================================================================

[HUD]
; 1 : le HUD de RoR2 (vie, niveau, or, competences, objets) s'affiche dans Skyrim.
Afficher = 1

; Taille du HUD (1.0 = normal, 1.3 = plus grand, 0.8 = plus petit).
Taille = 1.0

; 1 : cache la barre de vie de Skyrim quand RoR2 est connecte (celle de RoR2 la remplace).
CacherBarreVieSkyrim = 1

[Mains]
; 1 : en premiere personne, tu vois les bras et l'arme de ton survivant, avec ses vraies animations RoR2.
;     (le cadrage de chaque survivant se regle dans r2modman, sections "Mains - <survivant>")
Afficher = 1

; Taille de l'image des mains (1.0 = toute la largeur de l'ecran).
Taille = 1.0

; Descend l'image des mains (0.15 = de 15 % de la hauteur de l'ecran ; 0 = pas du tout).
; Attention : au-dessus de 0, le haut de l'image est coupe quand on regarde en l'air.
; Pour des armes plus basses, mieux vaut augmenter "VueHaut" dans r2modman (section Mains).
Descendre = 0

; 1 : cache les bras et l'arme de Skyrim pendant que les mains du survivant s'affichent.
CacherBrasSkyrim = 1

[TroisiemePersonne]
; 1 : a la 3e personne (touche F), RoR2 filme ton survivant depuis la camera de Skyrim (avec son skin, ses
;     animations et ses effets) et l'affiche a la place de ton personnage Skyrim, qui est cache.
;     La nettete et le nombre d'images se reglent dans r2modman (section "6 - Troisieme personne").
;     Le survivant est toujours dessine par-dessus le decor (un mur entre lui et la camera ne le cache pas).
Activer = 1

; 1 : un petit viseur au centre de l'ecran (les tirs visent la ou regarde la camera).
Viseur = 1

; Lumiere du survivant : elle suit celle de Skyrim (jour, nuit, interieur).
; Luminosite : multiplie le tout (1 = comme Skyrim). LumiereMin : jamais plus sombre que ca (0 a 1), pour le voir
; dans les donjons tres noirs. LumiereInterieurs : les interieurs sont surtout eclaires par des torches, que RoR2
; ne voit pas ; on renforce donc leur lumiere de base.
Luminosite = 1.0
LumiereMin = 0.25
LumiereInterieurs = 2.0


; ================================================================
;  4. JEU
; ================================================================

[Mouvement]
; 1 : ton personnage Skyrim prend la vitesse et la direction du survivant RoR2.
; 0 : desactive (Skyrim bouge a sa facon).
Suivre = 1

; Multiplie la vitesse du survivant dans Skyrim (1.0 = exactement celle de RoR2, 0.7 = un peu moins vite).
Vitesse = 1.0

; 1 : le sprint consomme l'endurance de Skyrim (barre verte). Vide = plus de sprint
;     jusqu'a ce qu'elle remonte a un quart. 0 : sprint illimite.
EnduranceSprint = 1

; Endurance consommee par le sprint (1.0 = 10 points par seconde, 2.0 = deux fois plus).
CoutSprint = 1.0

[Combat]
; Les degats s'adaptent tout seuls : il faut autant de coups pour tuer un bandit qu'un monstre RoR2
; de meme niveau, et les ennemis costauds (geants, dragons) restent plus resistants.
; Ces deux reglages servent a ajuster ensuite (1.0 = equilibrage normal).

; Degats de tes competences RoR2 sur les ennemis Skyrim (0.5 = ennemis 2x plus resistants, 1.0 = sans changement).
; (0.71 : remplace l'ancien reglage "Degats", qui ne sert plus.)
DegatsDonnes = 0.5

; Degats des ennemis Skyrim sur ton survivant (2.0 = coups 2x plus forts). S'applique a tout.
DegatsRecus = 1.0

; 0.71 : puis selon le type de coup.
;   DegatsCorpsACorps : armes, poings, morsures, fleches.
;   DegatsMagie       : sorts, cris, explosions magiques.
;   DegatsDuree       : poison et degats qui continuent sans nouveau coup (brulure, sort qui dure...).
DegatsCorpsACorps = 2.0
DegatsMagie = 0.5
DegatsDuree = 0.4

; 0.71 : un seul coup ne retire jamais plus que cette part de ta vie max (0.4 = 40 %). 0 = pas de plafond.
PlafondCoup = 0.4

; 1 : quand RoR2 pilote, les attaques normales de Skyrim (armes, arc, sorts) sont bloquees :
;     seules tes competences RoR2 frappent. 0 : les deux s'additionnent.
BloquerAttaquesSkyrim = 1

; 1 : les creatures NON hostiles (cerfs, lapins, chevaux sauvages...) peuvent etre frappees par tes
;     competences RoR2 (tes drones et tourelles ne les attaquent pas d'eux-memes). 0 : intouchables.
CreaturesPaisibles = 1

; Pareil pour les personnes non hostiles (passants, gardes, marchands). Attention aux primes ! 0 : intouchables.
PersonnesPaisibles = 1

[PV]
; 1 : vie partagee. Chaque PV de vie max gagne dans Skyrim au-dela du depart (point de niveau en Sante = +10,
;     enchantement, potion) s'ajoute a la vie max du survivant, et ta vie max Skyrim vaut celle du survivant.
Partager = 1

; Vie max de depart dans Skyrim (ce qui ne compte pas comme bonus).
Depart = 100


[Objets]
; Les objets RoR2 dans Skyrim. Ouvrir un contenant (coffre, urne, sac, tonneau...) pour la
; premiere fois coute des septims ; il peut alors donner un objet RoR2 a ton survivant.
; Les corps, tes propres coffres (maison) et les marchands ne coutent rien.
Activer = 1
; Prix en septims selon le contenant (0 = gratuit)
PrixPetit = 5
; (sacs, bourses, sacoches)
PrixMoyen = 10
; (urnes, tonneaux, paniers, caisses...)
PrixCoffre = 25
; (coffres)
PrixCoffreBoss = 50
; (le coffre du boss en fin de donjon)
; Chance (en %) qu'un contenant ordinaire donne un objet RoR2
ChanceObjet = 15
; Parmi ces objets, chance (en %) d'un vert (sinon blanc)
ChanceVert = 20
; Coffre du boss : toujours un objet, vert au minimum ; chance (en %) d'un rouge
ChanceRougeBoss = 20
; Retire les armes et armures du butin (inutiles pour un survivant). Potions, ingredients,
; objets de quete et le reste sont gardes.
RetirerArmesArmures = 1
; Chance (en %) d'un objet jaune (de boss) a la mort d'un boss de donjon ou d'un dragon
ChanceJauneBossDragon = 10
; 0.71 : selon le lieu (remplace l'ancien "ChanceVideDwemer", qui ne sert plus).
; Dans une ruine dwemer : chance (en %) qu'un objet trouve soit un EQUIPEMENT.
ChanceEquipementDwemer = 35
; Dans un lieu daedrique (sanctuaire, autel daedrique, Apocrypha...) : chance (en %) d'un objet du VIDE.
ChanceVideDaedrique = 35
; 0.71 : objets sanctifies (DLC Hallowed Concepts). Chance (en %) au coffre du boss d'un donjon difficile
; (boss de niveau NiveauDonjonDifficile ou plus), et sur un dragon.
ChanceSanctifieBoss = 15
ChanceSanctifieDragon = 5
NiveauDonjonDifficile = 30
; 0.71 : 1 chance sur N qu'une elite tuee lache son aspect (son equipement d'elite). 0 = jamais.
AspectUnSur = 300
; 0.71 : 1 chance sur N qu'une porte bleue vers le Bazar de Newt s'ouvre apres un coffre de boss. 0 = jamais.
BazarUnSur = 20
; Chance (en %) qu'un ennemi tue lache une piece lunaire (pour les capsules lunaires)
ChancePieceLunaire = 3
; L'or gagne dans RoR2 (ennemis tues) devient des septims : septims par piece d'or RoR2
SeptimsParOrRoR2 = 0.5

[Elites]
; 0.71 : 1 = les elites se voient dans Skyrim : aura de couleur (feu, glace, foudre) et couronne RoR2
;     au-dessus de la tete (la couronne apparait au lancement suivant celui ou RoR2 l'a convertie).
Apparence = 1
; Taille de la couronne (en metres). 0 = pas de couronne (l'aura reste).
TailleCouronne = 0.35

[ObjetsSkyrim]
; 1 : les objets RoR2 sont des objets divers dans ton inventaire Skyrim. Seuls ceux que tu PORTES
;     comptent dans RoR2 : tu peux jeter les autres, les ranger dans un coffre, les confier a un compagnon.
;     Les objets du vide et lunaires ne te quittent jamais : seul un autel d'Arkay (vide) ou de
;     Stendarr (lunaires, contre une Perle chacun) les retire, tous d'un coup.
;     Broyeur : en quittant une fonderie, fondre un objet porte en ferraille de sa couleur.
;     Bazar lunaire : en quittant une conversation avec Ri'saad, Ma'dran ou Ahkari.
;     0.71 : Marmite = CHEF errant de RoR2 : en quittant une marmite, combiner deux objets portes en un nouveau.
;     0.71 : Journal RoR2 : un livre dans ton inventaire, avec les objets deja trouves et ce qu'ils font.
;     0.72 : les EQUIPEMENTS sont des amulettes "[RoR2 equipement]". Celle que tu portes est l'equipement actif ;
;     garde les autres dans ton sac et change quand tu veux (la recharge de chacun est gardee). Un equipement
;     gagne va dans le sac. A la mort, les amulettes sur toi sont perdues (celles des coffres restent).
Activer = 1
; 1 : a la mort du survivant, pas de rechargement : tu te reveilles dans le dernier lit ou tu as dormi,
;     sans les objets RoR2 que tu portais (ceux des coffres sont gardes), et la difficulte repart a 1.
SansRechargement = 1
; 1 : on change de survivant en dormant (les autels debloquent seulement, F7/F8 ne servent plus).
ChangerEnDormant = 1
; Bazar lunaire : prix d'un objet, en pieces lunaires
PrixBazar = 2
; Purification lunaire : chance (en %) qu'une Perle soit une Perle irradiante
ChancePerleIrradiante = 10

[Difficulte]
; La difficulte monte de 1 a chaque coffre de boss charge (donjon termine), et un peu chaque jour.
; Elle rend les ennemis plus durs (PV et degats), les elites plus frequentes et les contenants plus chers.
ParJour = 0.25
; Prix des contenants : x (1 + HaussePrix x difficulte)
HaussePrix = 0.15
; Le coffre du boss : ouvrir lance une charge. Reste dans la zone (en m) pendant la duree (en s) ;
; des renforts (ennemis du donjon) arrivent regulierement. A la fin, le coffre donne son objet.
DureeCharge = 60
ZoneCharge = 12
IntervalleRenforts = 15
Renforts = 2

[AutelsRoR2]
; En entrant dans un donjon pour la premiere fois, un autel RoR2 peut y apparaitre (devant un contenant).
; On l'utilise en s'en approchant et en appuyant sur la touche Utiliser ([Touches]).
; Chance, Ordre, Combat, Sang, Montagne ; plus une capsule lunaire (pieces lunaires).
Activer = 1
; Chance (en %) qu'un donjon ait un autel
ChanceAutel = 60
; Chance (en %) qu'un donjon ait une capsule lunaire (toujours dans un sanctuaire daedrique)
ChanceCapsuleLunaire = 15
; Autel de la Chance : prix d'un essai (avant la difficulte ; +40 % par essai), et chance (en %) de ne rien gagner
PrixChance = 15
EchecChance = 45
; Capsule lunaire : pieces lunaires demandees
PiecesCapsule = 1
; Autel du Sang : septims donnes contre la moitie de tes PV (avant la difficulte)
SeptimsSang = 40
; Imprimante : chance (en %) qu'un donjon en ait une. Elle imprime toujours le meme objet,
; contre une ferraille de sa couleur (sinon un objet porte de sa couleur, au hasard).
ChanceImprimante = 30
; Drone ou tourelle casse, a reparer contre des septims : chance (en %) par donjon,
; et par cellule exterieure traversee (il est pose la ou tu es passe, un peu en arriere)
ChanceDrone = 35
ChanceDroneDehors = 5
; 0.66 : chaque objet RoR2 est pose sur le cote d'un contenant different, jamais devant une porte,
; devant un coffre ni dans un couloir etroit. Nombre par lieu selon sa taille : 1 (petit) a ce maximum.
ObjetsParLieuMax = 4
; Tailles (1 = taille du modele RoR2). Les autels de RoR2 sont tres grands, d'ou leur petite valeur.
TailleImprimante = 0.7
TailleCapsule = 0.7
TailleAutel = 0.28
; Drones et tourelles casses : taille en metres
HauteurDrone = 1.1


; ================================================================
;  5. EXPERIENCE
; ================================================================

[Experience]
; Tes competences Skyrim montent avec les coups RoR2 : chaque survivant fait monter la competence de ses
; coups donnes, et celle de ses coups recus. Experience = degats (en PV Skyrim) x ce multiplicateur.
; 1 = comme un coup normal de Skyrim. 0 = pas d'experience.
Multiplicateur = 1

; 1 : tes atouts Skyrim comptent aussi pour les degats du survivant (ex. Archerie +20 % pour la Chasseresse),
;     calcules comme si tu frappais a l'arc, a l'epee, a l'epee a deux mains ou avec le sort Flammes,
;     selon la competence des coups donnes du survivant. 0 : pas d'atouts.
AtoutsSurDegats = 1

; Competence des coups des drones, tourelles, balises du Capitaine et allies d'objets.
Allies = Conjuration

; 1 : les coups des OBJETS et de l'EQUIPEMENT font monter la competence de ce qui a frappe (missiles de l'ATG ->
;     Archerie, brulures -> Destruction feu, saignements -> Une main, Accumulateur Preon -> Destruction foudre,
;     Cube primordial -> Alteration...). Utiliser un equipement donne aussi un peu d'experience, meme sans
;     toucher personne (Fruit etranger -> Guerison, Carte executive -> Eloquence...). 0 : comme le M1.
ObjetsSelonSource = 1

[ExperienceSurvivants]
; survivant = M1, M2, Maj, R, coups recus  ("Aucune" pour rien)
; Une case avec plusieurs variantes : "Archerie/Destruction" = variante 1 / variante 2 (dans l'ordre de RoR2).
; Objets et equipement : comme M1. Noms des competences : voir [DefisVariantes].
Commando     = Archerie, Archerie, Archerie, Archerie/Destruction, Armure legere
Huntress     = Archerie, Archerie, Archerie, Archerie, Armure legere
Bandit2      = Archerie, Une main, Discretion, Archerie, Armure legere
Toolbot      = Archerie/Archerie/Destruction/Deux mains, Destruction, Deux mains, Archerie, Armure lourde
Engi         = Destruction, Conjuration, Parade/Archerie, Conjuration, Armure lourde
Mage         = Destruction, Destruction, Destruction, Destruction, Armure legere
Merc         = Une main, Une main, Une main, Une main, Armure legere
Treebot      = Alchimie, Alchimie, Alteration, Guerison, Armure lourde
Loader       = Deux mains, Deux mains, Deux mains, Destruction/Deux mains, Armure lourde
Croco        = Une main, Alchimie, Alchimie, Alchimie, Armure lourde
Captain      = Archerie, Archerie, Destruction, Conjuration, Armure legere
Railgunner   = Archerie, Archerie, Archerie/Alteration, Archerie, Armure legere
VoidSurvivor = Destruction, Destruction, Destruction, Destruction, Armure legere
Seeker       = Une main, Guerison, Guerison, Guerison, Armure legere
FalseSon     = Deux mains, Archerie, Deux mains, Destruction, Armure lourde
Chef         = Une main, Une main, Une main, Une main, Armure lourde
DroneTech    = Archerie, Conjuration, Conjuration, Conjuration, Armure legere
Drifter      = Deux mains, Deux mains, Deux mains, Deux mains, Armure legere
Enforcer2    = Une main/Destruction, Parade, Parade/Alteration, Armure lourde, Armure lourde
Acolyte      = Une main, Archerie/Conjuration, Archerie, Destruction, Armure legere

[ElementsDestruction]
; Element des attaques qui donnent de la Destruction : Feu, Foudre ou Gel (meme ordre "M1, M2, Maj, R",
; variantes separees par "/"). Les atouts Skyrim de cet element s'appliquent.
; Les cases qui ne sont pas en Destruction sont ignorees. Survivant absent : Feu.
Commando     = Feu, Feu, Feu, Feu
Toolbot      = Feu, Feu, Feu, Feu
Engi         = Feu, Feu, Feu, Feu
Mage         = Feu/Foudre, Foudre/Gel, Gel, Feu/Foudre
Loader       = Foudre, Foudre, Foudre, Foudre
Captain      = Feu, Feu, Feu, Feu
VoidSurvivor = Foudre, Foudre, Foudre, Foudre
FalseSon     = Foudre, Foudre, Foudre, Foudre
Enforcer2    = Feu, Feu, Feu, Feu
Acolyte      = Feu, Feu, Feu, Feu

[EffetsDestruction]
; Les coups RoR2 en Destruction (voir [ElementsDestruction], et les objets de feu, de gel, de foudre) font comme
; les sorts de Skyrim, sur les ennemis seulement :
;   Feu    : brulure (une part du coup en degats de feu sur 3 secondes)
;   Gel    : l'ennemi perd de la vigueur et est ralenti de moitie pendant 3 secondes
;   Foudre : l'ennemi perd de la magie
; Les atouts "Feu / Gel / Foudre augmentes" augmentent deja les degats (voir [Experience] AtoutsSurDegats).
; 1 : ces effets. 0 : seulement les degats.
Effets = 1
; 1 : les atouts de fin d'arbre marchent aussi avec les competences RoR2 :
;   Flammes intenses : un ennemi presque mort (moins de SeuilFuite) s'enfuit 8 secondes
;   Gel profond      : un ennemi presque mort (moins de SeuilParalysie) est paralyse 4 secondes
;   Desintegration   : un ennemi presque mort (moins de SeuilDesintegration) est reduit en cendres
AtoutsFinArbre = 1
; Brulure : part du coup en feu (0.25 = 25 %). Gel : vigueur perdue (x degats). Foudre : magie perdue (x degats).
Brulure = 0.25
Gel = 1
Foudre = 0.5
; Seuils de vie (0.2 = 20 % de sa vie max).
SeuilFuite = 0.2
SeuilParalysie = 0.2
SeuilDesintegration = 0.15


; ================================================================
;  6. SURVIVANTS (deblocage)
; ================================================================

[Autels]
; 1 : chaque autel des Divins debloque un survivant RoR2 pour cette sauvegarde, puis ouvre une fenetre
;     pour choisir parmi les survivants debloques. Les princes daedriques donnent le leur a la fin de
;     leur quete ([QuetesSurvivants]). Le Commando est debloque d'office.
;     La sauvegarde retient aussi ton survivant en cours.
; 0 : tous les survivants sont libres (F8 / F7 passent par tous).
Activer = 1

; 1 : F8 / F7 passent quand meme par TOUS les survivants (triche, pour les tests).
; 0 : F8 / F7 passent seulement par les survivants debloques.
ToucheTousLesSurvivants = 0

[AutelsSurvivants]
