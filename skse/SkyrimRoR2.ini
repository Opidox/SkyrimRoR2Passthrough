; ================================================================
;  7. SKILL VARIANTS AND SKINS
; ================================================================

[Variantes]
; Skill variants (Magic menu > Powers, "RoR2 ..." powers).
; 1: every variant and skin is free (for testing). 0: the challenges below must be completed.
ToutDebloque = 0

[DefisVariantes]
; The Skyrim challenge that unlocks each variant. Left: survivor . skill (1 = M1, 2 = M2,
; 3 = Shift, 4 = R, 6 and 7 = extra slots like the Acolyte's passive and Litany) . variant number
; (0 = the base variant, always free; the numbers are in %LOCALAPPDATA%\SkyrimRoR2\variantes.txt).
; Right: a Skyrim skill and the level to reach (base level, without item or potion bonuses).
; The comment after each line is the variant's name (all names are in variantes.txt).
; Skills: Archery, One-handed, Two-handed, Block, Smithing, Heavy Armor, Light Armor, Pickpocket,
; Lockpicking, Sneak, Alchemy, Speech, Alteration, Conjuration, Destruction, Illusion,
; Restoration, Enchanting. Or "Level 20" for the character's level, or "Dragons 5" for dragons killed
; (counted by the mod: each dragon that dies within 100 m of you). A variant with no line is free.

