; ================================================================
;  SkyrimRoR2 - settings
; ================================================================
;  Change the value after the = sign, then save.
;  No need to rebuild anything: just reload your save in Skyrim
;  (this file is read again every time a game is loaded).
;
;  The setting NAMES (left of the =) are in French: keep them as they are,
;  only change the values. Each one is explained in English above it.
;
;  Contents:
;    0. Language ......... [Langue]
;    1. Controls ......... [Touches]
;    2. Startup .......... [Lancement]
;    3. Display .......... [HUD] [Mains] [TroisiemePersonne]
;    4. Gameplay ......... [Mouvement] [Combat] [PV] [Objets] [Elites] [ObjetsSkyrim] [Difficulte] [AutelsRoR2]
;    5. Experience ....... [Experience] [ExperienceSurvivants] [ElementsDestruction] [EffetsDestruction]
;    6. Survivors ........ [Autels] [AutelsSurvivants] [QuetesSurvivants]
;    7. Variants ......... [Variantes] [DefisVariantes]
;    8. Copied world ..... [Decor] [Sol] [Relief]
;
;  Internal survivor names (used everywhere in this file):
;    Commando, Huntress, Bandit2 (Bandit), Toolbot (MUL-T), Engi (Engineer),
;    Mage (Artificer), Merc (Mercenary), Treebot (REX), Loader, Croco (Acrid),
;    Captain, Railgunner, VoidSurvivor (Void Fiend), Seeker, FalseSon (False Son),
;    Chef, DroneTech (Operator), Drifter, Enforcer2 (Enforcer), Acolyte.
; ================================================================

[Test]
; 1: TEST MODE, everything is unlocked at once, without touching your save:
;    - F8 / F7 go through ALL survivors (even with "switch by sleeping");
;    - every skill variant and every skin is free (Magic menu > Powers).
;    Set it back to 0 and reload your save: your real unlocks come back.
; 0: normal game (shrines, quests and challenges).
ModeTest = 0


; ================================================================
;  0. LANGUAGE
; ================================================================

[Langue]
; Language of the mod's texts (messages, HUD, menus).
; auto = the language of your Skyrim. Or: english, french, german, italian, spanish, polish, russian,
; japanese, chinese. The texts are in Data\SKSE\Plugins\SkyrimRoR2_Lang\<language>.txt.
; RoR2 names (items, survivors, skills) follow the same language when RoR2 has it.
Langue = auto
; 1: letters without accents (e instead of e-acute...), if your Skyrim font shows accented letters as squares.
SansAccents = 0


; ================================================================
;  1. CONTROLS
; ================================================================

[Touches]
; Letters and digits: write them as they are on YOUR keyboard.
; Auto (movement only): the key at the place of W A S D on a QWERTY keyboard, whatever your keyboard
; (Z Q S D on AZERTY, W A S D on QWERTY...).
; Special names:
;   Space  Tab  Enter  Backspace
;   LeftCtrl  RightCtrl  LeftShift  RightShift  LeftAlt  RightAlt
;   LeftClick  RightClick  MiddleClick  Mouse4  Mouse5
;   F1 to F12
;   None   (nothing for this action)
Avancer = Auto
Reculer = Auto
Gauche = Auto
Droite = Auto

; Jump and sprint
Saut = Space
Sprint = LeftAlt

; RoR2 survivor skills (M1, M2, utility, special)
Competence1 = LeftClick
Competence2 = RightClick
Competence3 = LeftShift
Competence4 = R

; Next / previous survivor during a game (only if ChangerEnDormant = 0, or with ToucheTousLesSurvivants)
SurvivantSuivant = F8
SurvivantPrecedent = F7

; Use the RoR2 equipment (orange item: Preon Accumulator...)
Equipement = G
; Use a RoR2 shrine in a dungeon (standing next to it)
Utiliser = E
; Show / hide the list of your RoR2 items (name, count, description)
ListeObjets = O
; Open the logbook of the RoR2 items found so far (outside menus)
JournalRoR2 = K


; ================================================================
;  2. STARTUP
; ================================================================

[Lancement]
; After loading, Skyrim's world stays frozen until RoR2 has started its run
; (seconds at most; 0 = do not wait)
AttendreRoR2 = 90
; 1: Skyrim starts RoR2 by itself (with your r2modman profile), in a small window.
LancerRoR2 = 1

; 1: RoR2 skips its menus and starts a run by itself.
;    If your survivor dies, it starts a new run when you reload your Skyrim save.
PartieAuto = 1

; The survivor of the automatic run (internal name, see the contents above).
Survivant = Commando

; Folder of your r2modman profile. Empty = the usual "Passthrough" profile.
ProfilR2modman =

; Size of the RoR2 window at startup (0 = do not change).
FenetreLargeur = 960
FenetreHauteur = 540

; 1: the RoR2 window is hidden (everything shows in Skyrim through the HUD).
; 0: it stays visible (handy to compare).
CacherFenetreRoR2 = 1


; ================================================================
;  3. DISPLAY
; ================================================================

[HUD]
; 1: the RoR2 HUD (health, level, gold, skills, items) is drawn in Skyrim.
Afficher = 1

; HUD size (1.0 = normal, 1.3 = bigger, 0.8 = smaller).
Taille = 1.0

; 1: hides Skyrim's health bar while RoR2 is connected (RoR2's bar replaces it).
CacherBarreVieSkyrim = 1

[Mains]
; 1: in first person you see your survivor's arms and weapon, with their real RoR2 animations.
;    (each survivor's framing is set in r2modman, sections "Mains - <survivor>")
Afficher = 1

; Size of the hands picture (1.0 = the whole screen width).
Taille = 1.0

; Moves the hands picture down (0.15 = by 15 % of the screen height; 0 = not at all).
; Careful: above 0, the top of the picture is cut off when looking up.
; For lower weapons, rather increase "VueHaut" in r2modman (Mains section).
Descendre = 0

; 1: hides Skyrim's arms and weapon while the survivor's hands are shown.
CacherBrasSkyrim = 1

[TroisiemePersonne]
; 1: in third person (F key), RoR2 films your survivor from Skyrim's camera (with its skin, animations
;    and effects) and shows it in place of your Skyrim character, which is hidden.
;    Sharpness and frame rate are set in r2modman (section "6 - Troisieme personne").
Activer = 1

; 1: a small crosshair in the middle of the screen (shots go where the camera looks).
Viseur = 1

; Survivor lighting: it follows Skyrim's light (day, night, interiors).
; Luminosite: multiplies everything (1 = like Skyrim). LumiereMin: never darker than this (0 to 1), to see it
; in very dark dungeons. LumiereInterieurs: interiors are mostly lit by torches, which RoR2 does not see,
; so their base light is boosted.
Luminosite = 1.0
LumiereMin = 0.25
LumiereInterieurs = 2.0


; ================================================================
;  4. GAMEPLAY
; ================================================================

[Mouvement]
; 1: your Skyrim character takes the speed and direction of the RoR2 survivor.
; 0: off (Skyrim moves its own way).
Suivre = 1

; Multiplies the survivor's speed in Skyrim (1.0 = exactly RoR2's, 0.7 = a bit slower).
Vitesse = 1.0

; 1: sprinting uses Skyrim's stamina (green bar). Empty = no more sprinting
;    until it is back to a quarter. 0: unlimited sprint.
EnduranceSprint = 1

; Stamina used by sprinting (1.0 = 10 points per second, 2.0 = twice as much).
CoutSprint = 1.0

[Combat]
; Damage adapts by itself: it takes as many hits to kill a bandit as a RoR2 monster of the same level,
; and tough enemies (giants, dragons) stay tougher.
; These settings fine-tune it afterwards (1.0 = normal balance).

; Damage of your RoR2 skills on Skyrim enemies (0.5 = enemies twice as tough, 1.0 = unchanged).
DegatsDonnes = 0.5

; Damage of Skyrim enemies on your survivor (2.0 = hits twice as strong). Applies to everything.
DegatsRecus = 1.0

; Then by kind of hit:
;   DegatsCorpsACorps : weapons, fists, bites, arrows.
;   DegatsMagie       : spells, shouts, magic explosions.
;   DegatsDuree       : poison and damage that keeps going without a new hit (burning, lasting spell...).
DegatsCorpsACorps = 2.0
DegatsMagie = 0.5
DegatsDuree = 0.4

; A single hit never takes more than this share of your max health (0.4 = 40 %). 0 = no cap.
PlafondCoup = 0.4

; 1: while RoR2 is in control, Skyrim's normal attacks (weapons, bow, spells) are blocked:
;    only your RoR2 skills hit. 0: both add up.
BloquerAttaquesSkyrim = 1

; 1: NON-hostile creatures (deer, rabbits, wild horses...) can be hit by your RoR2 skills
;    (your drones and turrets do not attack them on their own). 0: untouchable.
CreaturesPaisibles = 1

; Same for non-hostile people (passers-by, guards, merchants). Watch out for bounties! 0: untouchable.
PersonnesPaisibles = 1

[PV]
; 1: shared health. Every max health point gained in Skyrim above the start value (level-up in Health = +10,
;    enchantment, potion) is added to the survivor's max health, and your Skyrim max health equals the survivor's.
Partager = 1

; Starting max health in Skyrim (what does not count as a bonus).
Depart = 100


[Objets]
; RoR2 items in Skyrim. Opening a container (chest, urn, sack, barrel...) for the first time costs
; septims; it may then give a RoR2 item to your survivor.
; Bodies, your own chests (house) and merchants cost nothing.
Activer = 1
; Price in septims by container (0 = free)
PrixPetit = 5
; (sacks, purses, satchels)
PrixMoyen = 10
; (urns, barrels, baskets, crates...)
PrixCoffre = 25
; (chests)
PrixCoffreBoss = 50
; (the boss chest at the end of a dungeon)
; Chance (in %) that an ordinary container gives a RoR2 item
ChanceObjet = 15
; Among those items, chance (in %) of a green one (otherwise white)
ChanceVert = 20
; Boss chest: always an item, at least green; chance (in %) of a red one
ChanceRougeBoss = 20
; Removes weapons and armor from loot (useless for a survivor). Potions, ingredients,
; quest items and the rest are kept.
RetirerArmesArmures = 1
; Chance (in %) of a yellow (boss) item when a dungeon boss or a dragon dies
ChanceJauneBossDragon = 10
; In a Dwemer ruin: chance (in %) that an item found is an EQUIPMENT.
ChanceEquipementDwemer = 35
; In a Daedric place (shrine, Daedric altar, Apocrypha...): chance (in %) of a VOID item.
ChanceVideDaedrique = 35
; Hallowed items (Hallowed Concepts DLC). Chance (in %) in the boss chest of a hard dungeon
; (boss of level NiveauDonjonDifficile or more), and on a dragon.
ChanceSanctifieBoss = 15
ChanceSanctifieDragon = 5
NiveauDonjonDifficile = 30
; 1 chance in N that a killed elite drops its aspect (its elite equipment). 0 = never.
AspectUnSur = 300
; 1 chance in N that a blue portal to Newt's Bazaar opens after a boss chest. 0 = never.
BazarUnSur = 20
; Chance (in %) that a killed enemy drops a lunar coin (for lunar pods)
ChancePieceLunaire = 3
; Gold earned in RoR2 (killed enemies) becomes septims: septims per RoR2 gold
SeptimsParOrRoR2 = 0.5

[Elites]
; 1: elites show in Skyrim: colored aura (fire, ice, lightning) and a RoR2 crown
;    above the head (the crown appears from the launch after the one where RoR2 converted it).
Apparence = 1
; Crown size (in meters). 0 = no crown (the aura stays).
TailleCouronne = 0.35

[ObjetsSkyrim]
; 1: RoR2 items are misc items in your Skyrim inventory. Only the ones you CARRY count in RoR2:
;    you can drop the others, store them in a chest, give them to a follower.
;    Void and lunar items never leave you: only a shrine of Arkay (void) or of Stendarr
;    (lunar, for one Pearl each) removes them, all at once.
;    Scrapper: when leaving a smelter, melt a carried item into scrap of its color.
;    Lunar bazaar: when leaving a conversation with Ri'saad, Ma'dran or Ahkari.
;    Cooking pot = RoR2's wandering CHEF: when leaving a cooking pot, combine two carried items into a new one.
;    RoR2 Logbook: lists the items found so far and what they do (key JournalRoR2).
;    EQUIPMENT items are "[RoR2 equipment]" amulets. The one you wear is the active equipment;
;    keep the others in your bag and switch whenever you want (each one keeps its cooldown). A new equipment
;    goes to the bag. On death, the amulets on you are lost (the ones in chests stay).
Activer = 1
; 1: when the survivor dies, no reload: you wake up in the last bed you slept in,
;    without the RoR2 items you carried (the ones in chests are kept), and difficulty goes back to 1.
SansRechargement = 1
; 1: you switch survivor by sleeping (shrines only unlock, F7/F8 are no longer used).
ChangerEnDormant = 1
; Lunar bazaar: price of an item, in lunar coins
PrixBazar = 2
; Lunar cleansing: chance (in %) that a Pearl is an Irradiant Pearl
ChancePerleIrradiante = 10

[Difficulte]
; Difficulty goes up by 1 with every charged boss chest (dungeon cleared), and a little every day.
; It makes enemies tougher (health and damage), elites more frequent and containers more expensive.
ParJour = 0.25
; Container prices: x (1 + HaussePrix x difficulty)
HaussePrix = 0.15
; The boss chest: opening it starts a charge. Stay in the zone (in m) for the duration (in s);
; reinforcements (dungeon enemies) keep coming. At the end, the chest gives its item.
DureeCharge = 60
ZoneCharge = 12
IntervalleRenforts = 15
Renforts = 2

[AutelsRoR2]
; When you enter a dungeon for the first time, a RoR2 shrine may appear there (in front of a container).
; Use it by walking up to it and pressing the Utiliser key ([Touches]).
; Chance, Order, Combat, Blood, Mountain; plus a lunar pod (lunar coins).
Activer = 1
; Chance (in %) that a dungeon has a shrine
ChanceAutel = 60
; Chance (in %) that a dungeon has a lunar pod (always in a Daedric shrine)
ChanceCapsuleLunaire = 15
; Shrine of Chance: price of a try (before difficulty; +40 % per try), and chance (in %) of winning nothing
PrixChance = 15
EchecChance = 45
; Lunar pod: lunar coins needed
PiecesCapsule = 1
; Shrine of Blood: septims given for half your health (before difficulty)
SeptimsSang = 40
; Printer: chance (in %) that a dungeon has one. It always prints the same item,
; for a scrap of its color (otherwise a random carried item of its color).
ChanceImprimante = 30
; Broken drone or turret, to repair for septims: chance (in %) per dungeon,
; and per outdoor cell you walk through (it is placed where you went, a bit behind)
ChanceDrone = 35
ChanceDroneDehors = 5
; Each RoR2 object is placed at the side of a different container, never in front of a door,
; in front of a chest or in a narrow corridor. Number per place by its size: 1 (small) to this maximum.
ObjetsParLieuMax = 4
; Sizes (1 = size of the RoR2 model). RoR2 shrines are very big, hence the small value.
TailleImprimante = 0.7
TailleCapsule = 0.7
TailleAutel = 0.28
; Broken drones and turrets: height in meters
HauteurDrone = 1.1


; ================================================================
;  5. EXPERIENCE
; ================================================================

[Experience]
; Your Skyrim skills level up with RoR2 hits: each survivor levels the skill of its hits dealt,
; and the one of its hits taken. Experience = damage (in Skyrim health) x this multiplier.
; 1 = like a normal Skyrim hit. 0 = no experience.
Multiplicateur = 1

; 1: your Skyrim perks also count for the survivor's damage (e.g. Archery +20 % for the Huntress),
;    computed as if you hit with a bow, a sword, a two-handed sword or the Flames spell,
;    depending on the skill of the survivor's hits. 0: no perks.
AtoutsSurDegats = 1

; Skill of the hits of drones, turrets, Captain's beacons and item allies.
Allies = Conjuration

; 1: hits from ITEMS and EQUIPMENT level the skill of whatever hit (ATG missiles ->
;    Archery, burns -> fire Destruction, bleeds -> One-handed, Preon Accumulator -> shock Destruction,
;    Primordial Cube -> Alteration...). Using an equipment also gives a little experience, even without
;    hitting anyone (Foreign Fruit -> Restoration, Executive Card -> Speech...). 0: like M1.
ObjetsSelonSource = 1

[ExperienceSurvivants]
; survivor = M1, M2, Shift, R, hits taken  ("None" for nothing)
; A slot with several variants: "Archery/Destruction" = variant 1 / variant 2 (in RoR2's order).
; Items and equipment: like M1. Skill names: see [DefisVariantes].
Commando     = Archery, Archery, Archery, Archery/Destruction, Light Armor
Huntress     = Archery, Archery, Archery, Archery, Light Armor
Bandit2      = Archery, One-handed, Sneak, Archery, Light Armor
Toolbot      = Archery/Archery/Destruction/Two-handed, Destruction, Two-handed, Archery, Heavy Armor
Engi         = Destruction, Conjuration, Block/Archery, Conjuration, Heavy Armor
Mage         = Destruction, Destruction, Destruction, Destruction, Light Armor
Merc         = One-handed, One-handed, One-handed, One-handed, Light Armor
Treebot      = Alchemy, Alchemy, Alteration, Restoration, Heavy Armor
Loader       = Two-handed, Two-handed, Two-handed, Destruction/Two-handed, Heavy Armor
Croco        = One-handed, Alchemy, Alchemy, Alchemy, Heavy Armor
Captain      = Archery, Archery, Destruction, Conjuration, Light Armor
Railgunner   = Archery, Archery, Archery/Alteration, Archery, Light Armor
VoidSurvivor = Destruction, Destruction, Destruction, Destruction, Light Armor
Seeker       = One-handed, Restoration, Restoration, Restoration, Light Armor
FalseSon     = Two-handed, Archery, Two-handed, Destruction, Heavy Armor
Chef         = One-handed, One-handed, One-handed, One-handed, Heavy Armor
DroneTech    = Archery, Conjuration, Conjuration, Conjuration, Light Armor
Drifter      = Two-handed, Two-handed, Two-handed, Two-handed, Light Armor
Enforcer2    = One-handed/Destruction, Block, Block/Alteration, Heavy Armor, Heavy Armor
Acolyte      = One-handed, Archery/Conjuration, Archery, Destruction, Light Armor

[ElementsDestruction]
; Element of the attacks that give Destruction: Fire, Shock or Frost (same order "M1, M2, Shift, R",
; variants separated by "/"). Skyrim perks of that element apply.
; Slots that are not Destruction are ignored. Survivor not listed: Fire.
Commando     = Fire, Fire, Fire, Fire
Toolbot      = Fire, Fire, Fire, Fire
Engi         = Fire, Fire, Fire, Fire
Mage         = Fire/Shock, Shock/Frost, Frost, Fire/Shock
Loader       = Shock, Shock, Shock, Shock
Captain      = Fire, Fire, Fire, Fire
VoidSurvivor = Shock, Shock, Shock, Shock
FalseSon     = Shock, Shock, Shock, Shock
Enforcer2    = Fire, Fire, Fire, Fire
Acolyte      = Fire, Fire, Fire, Fire

[EffetsDestruction]
; RoR2 hits in Destruction (see [ElementsDestruction], and fire, frost and shock items) work like
; Skyrim spells, on enemies only:
;   Fire  : burning (part of the hit as fire damage over 3 seconds)
;   Frost : the enemy loses stamina and is slowed by half for 3 seconds
;   Shock : the enemy loses magicka
; The "Augmented Flames / Frost / Shock" perks already raise damage (see [Experience] AtoutsSurDegats).
; 1: these effects. 0: damage only.
Effets = 1
; 1: the end-of-tree perks also work with RoR2 skills:
;   Intense Flames : an almost dead enemy (below SeuilFuite) flees for 8 seconds
;   Deep Freeze    : an almost dead enemy (below SeuilParalysie) is paralyzed for 4 seconds
;   Disintegrate   : an almost dead enemy (below SeuilDesintegration) is turned to ash
AtoutsFinArbre = 1
; Burning: share of the hit as fire (0.25 = 25 %). Frost: stamina lost (x damage). Shock: magicka lost (x damage).
Brulure = 0.25
Gel = 1
Foudre = 0.5
; Health thresholds (0.2 = 20 % of its max health).
SeuilFuite = 0.2
SeuilParalysie = 0.2
SeuilDesintegration = 0.15


